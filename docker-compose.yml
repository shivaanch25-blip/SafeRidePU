version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: saferide_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - saferide_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: saferide_server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./shared:/shared
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/saferide
      - NODE_ENV=development
    depends_on:
      - mongodb
    networks:
      - saferide_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: saferide_client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
      - ./shared:/shared
    depends_on:
      - server
    networks:
      - saferide_net

volumes:
  mongo_data:

networks:
  saferide_net:
    driver: bridge
